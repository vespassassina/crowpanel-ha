name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engineering_sample: ["false", "true"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .esphome
          key: esphome-${{ matrix.engineering_sample }}-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - name: Throwaway secrets
        run: |
          sed "s|REPLACE_ME|$(openssl rand -base64 32)|" secrets.example.yaml > secrets.yaml
          cp secrets.yaml examples/
      - run: esphome -s engineering_sample ${{ matrix.engineering_sample }} config examples/minimal.yaml > /dev/null
      - run: esphome -s engineering_sample ${{ matrix.engineering_sample }} compile crowpanel-ha.yaml
